name: Status

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Exportar estado vivo a status.json
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/status-export.py --out app/status.json
          python3 -m json.tool app/status.json > /dev/null
          python3 tools/status-validate.py app/status.json tools/status.schema.json

      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"
        working-directory: ./app

      - name: Build Astro site
        working-directory: ./app
        run: |
          npm ci
          npm run build

      - name: Publicar en rama gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .deploy
          cp -r app/dist/. .deploy/
          cp app/CNAME .deploy/CNAME 2>/dev/null || true
          git checkout --orphan gh-pages 2>/dev/null || git checkout gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          cp -r .deploy/. .
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios; no se publica."
          else
            git commit -m "chore(status): actualizar status.json + rebuild Astro [skip ci]"
            git push -f origin gh-pages
          fi
