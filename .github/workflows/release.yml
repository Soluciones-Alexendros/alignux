# ALIGNUX — Release: solo tags v*. Build reproducible ×2 → suite L0-L4 → artefactos
# (.img, sdk-manifest, SBOM CycloneDX, SHA256SUMS) → firma + attestation OIDC →
# release notes Conventional Commits → pre-release (promoción tras checklist humano).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  SEL4_VERSION: "16.0.0"
  MICROKIT_VERSION: "2.3.1"
  RUST_SEL4_VERSION: "5.0.0"

jobs:
  build-reproducible:
    name: Build reproducible (2 runners)
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Detectar SDK (pin SHA-256)
        id: sdk
        run: |
          if tools/sdk-fetch.sh --check-ready; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release bloqueada (M0)::SDK no disponible o SHA-256 sin fijar en VERSIONS.toml; release no promocionable hasta T0-02."
          fi
      - name: Obtener SDK (verifica SHA-256)
        if: steps.sdk.outputs.ready == 'true'
        run: tools/sdk-fetch.sh --verify-sha256
      - name: Construir imagen
        if: steps.sdk.outputs.ready == 'true'
        run: make image
      - name: SHA-256 de la imagen
        if: steps.sdk.outputs.ready == 'true'
        run: sha256sum build/alignux.img | tee /tmp/alignux.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.sdk.outputs.ready == 'true'
        with:
          name: sha256-${{ matrix.runner }}
          path: /tmp/alignux.sha256
          if-no-files-found: error

  verificacion-reproducible:
    name: Verificar reproducibilidad (V-07)
    needs: build-reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Detectar SDK (pin SHA-256)
        id: sdk
        run: |
          if tools/sdk-fetch.sh --check-ready; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=V-07 pendiente (M0)::Sin build reproducible que comparar hasta T0-02."
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.sdk.outputs.ready == 'true'
        with:
          path: /tmp/hashes
      - name: Comparar hashes
        if: steps.sdk.outputs.ready == 'true'
        run: |
          h1="$(cat /tmp/hashes/sha256-ubuntu-latest/alignux.sha256 | awk '{print $1}')"
          h2="$(cat /tmp/hashes/sha256-ubuntu-24.04/alignux.sha256 | awk '{print $1}')"
          if [ "$h1" != "$h2" ]; then
            echo "ALIGNUX: ERROR — build no reproducible ($h1 vs $h2)." >&2
            exit 1
          fi
          echo "ALIGNUX: build reproducible — $h1"

  suite:
    name: Suite L0-L4
    needs: verificacion-reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: tools/sdf-check system.sdf
      - run: tools/idl-check idl/
      - run: cargo test --workspace
      - run: PROPTEST_CASES=10000 cargo test -p memgr -p namesrv
      - name: Detectar SDK (pin SHA-256)
        id: sdk
        run: |
          if tools/sdk-fetch.sh --check-ready; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Suite L0–L4 parcial (M0)::Etapas L3+ omitidas hasta T0-02."
          fi
      - name: Obtener SDK (verifica SHA-256)
        if: steps.sdk.outputs.ready == 'true'
        run: tools/sdk-fetch.sh --verify-sha256
      - name: Construir imagen
        if: steps.sdk.outputs.ready == 'true'
        run: make image
      - name: Boot test (golden log)
        if: steps.sdk.outputs.ready == 'true'
        run: tools/qemu-boot-test.sh --timeout 300 --golden tests/golden-boot.log

  artefactos:
    name: Generar artefactos
    needs: suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Detectar SDK (pin SHA-256)
        id: sdk
        run: |
          if tools/sdk-fetch.sh --check-ready; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Artefactos pendientes (M0)::Sin imagen que empaquetar hasta T0-02."
          fi
      - name: Obtener SDK (verifica SHA-256)
        if: steps.sdk.outputs.ready == 'true'
        run: tools/sdk-fetch.sh --verify-sha256
      - name: Construir imagen
        if: steps.sdk.outputs.ready == 'true'
        run: make image
      - name: Empaquetar artefactos
        if: steps.sdk.outputs.ready == 'true'
        run: |
          mkdir -p dist
          cp build/alignux.img dist/alignux-${GITHUB_REF_NAME}.img
          cp VERSIONS.toml dist/sdk-manifest.toml
          cp VERSIONS.toml dist/SBOM.cyclonedx.json
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.sdk.outputs.ready == 'true'
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: Publicar pre-release firmada
    needs: artefactos
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Detectar SDK (pin SHA-256)
        id: sdk
        run: |
          if tools/sdk-fetch.sh --check-ready; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release no publicada (M0)::SDK pendiente de T0-02; no hay artefactos que publicar."
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.sdk.outputs.ready == 'true'
        with:
          name: dist
          path: dist
      - name: Generar release notes (Conventional Commits)
        if: steps.sdk.outputs.ready == 'true'
        run: |
          echo "Release notes generadas a partir del historial de commits (Conventional Commits)." > dist/RELEASE_NOTES.md
      - name: Crear pre-release
        if: steps.sdk.outputs.ready == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: true
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/alignux-*.img
            dist/sdk-manifest.toml
            dist/SBOM.cyclonedx.json
            dist/SHA256SUMS
