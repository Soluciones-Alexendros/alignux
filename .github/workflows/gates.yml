name: Gates

on:
  schedule:
    - cron: "30 4 * * 1" # lunes 04:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: gates
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Evaluar gate de la fase actual
        id: gate
        run: |
          python3 tools/gate-check.py > /tmp/gate-report.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Comentar resultado en el issue del gate
        if: always()
        run: |
          GATE_ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
            --search "in:title \"[G0] Gate M0 — Cimientos\"" --json number --jq '.[0].number')
          if [ -z "$GATE_ISSUE" ] || [ "$GATE_ISSUE" = "null" ]; then
            echo "No se encontró el issue del gate G0; se omite el comentario."
            exit 0
          fi
          {
            printf 'Actualización automática del gate (run %s):\n\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            cat /tmp/gate-report.txt
          } > /tmp/gate-comment.txt
          gh issue comment "$GATE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/gate-comment.txt
