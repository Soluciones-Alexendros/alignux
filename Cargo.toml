[workspace]
resolver = "2"
members = [
    "services/memgr",
    "services/namesrv",
    "services/resmgr",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
rust-sel4 = "=5.0.0"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
